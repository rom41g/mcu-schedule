<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>МГПУ • Расписание ИИЯ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --mgpu-red: #E30613;
      --mgpu-red-light: #FEECEB;
      --mgpu-dark: #1D1D1B;
      --bg: #F5F6F8;
      --card-bg: #FFFFFF;
      --text-sub: #7A7A7E;
      --border: #E8E8ED;
      --accent-orange: #FFF3E0;
      --accent-orange-text: #E65100;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--mgpu-dark); padding-bottom: 30px; user-select: none; }

    /* Шапка МГПУ */
    .header {
      background: #FFFFFF;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--mgpu-red);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { height: 36px; width: 36px; object-fit: contain; }
    .header-titles h1 { font-size: 15px; font-weight: 800; line-height: 1.1; }
    .header-titles .current-group { font-size: 12px; color: var(--mgpu-red); font-weight: 700; }

    /* Профиль пользователя Telegram */
    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 8px 4px 4px;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .user-profile-btn:active { opacity: 0.7; }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--mgpu-red);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      object-fit: cover;
    }
    .user-name { font-size: 12px; font-weight: 600; max-width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Выбор диапазона дат */
    .date-panel { padding: 12px 16px 6px; }
    .week-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--mgpu-dark);
      outline: none;
    }

    /* Лента дней недели */
    .days-bar {
      display: flex;
      gap: 6px;
      padding: 8px 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .days-bar::-webkit-scrollbar { display: none; }
    .day-chip {
      flex: 1;
      min-width: 48px;
      text-align: center;
      padding: 9px 2px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      transition: 0.15s ease;
    }
    .day-chip.active {
      background: var(--mgpu-red);
      border-color: var(--mgpu-red);
      color: #FFF;
    }

    /* Карточки расписания */
    .schedule-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .lesson-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 4px solid var(--mgpu-red);
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .lesson-card.parallel {
      border-left-color: var(--accent-orange-text);
      background: #FDFAF5;
    }
    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .lesson-time { font-size: 12px; font-weight: 700; color: var(--mgpu-red); }
    .badges { display: flex; gap: 5px; }
    .badge {
      background: var(--mgpu-red-light);
      color: var(--mgpu-red);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.parallel-badge {
      background: var(--accent-orange);
      color: var(--accent-orange-text);
    }
    .lesson-name { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
    .lesson-info { font-size: 13px; color: var(--text-sub); }
    .lesson-room { font-weight: 600; color: var(--mgpu-dark); margin-top: 2px; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 14px; }

    /* Модальное окно (Шторка с поддержкой свайпа вниз) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .modal-sheet {
      background: #FFFFFF;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 10px 20px 30px;
      box-shadow: 0 -6px 25px rgba(0,0,0,0.18);
      position: relative;
      touch-action: pan-y;
      transition: transform 0.25s ease-out;
    }

    /* Ручка свайпа (Drag Handle) */
    .drag-handle-bar {
      width: 40px;
      height: 5px;
      background: #D1D1D6;
      border-radius: 3px;
      margin: 4px auto 14px;
      cursor: grab;
    }
    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .modal-title { font-size: 18px; font-weight: 800; color: var(--mgpu-dark); }
    .modal-close-btn {
      background: #EFEFF4;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      color: #8E8E93;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .modal-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.4; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
    .modal-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      background: #FAFAFA;
      color: var(--mgpu-dark);
      outline: none;
    }
    .modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--mgpu-red);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .modal-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="МГПУ" class="header-logo" onerror="this.style.display='none'">
      <div class="header-titles">
        <h1>МГПУ • ИИЯ</h1>
        <div class="current-group" id="headerGroupLabel">Группа не выбрана</div>
      </div>
    </div>
    <div class="user-profile-btn" onclick="openProfileModal()">
      <div id="avatarContainer"></div>
      <span class="user-name" id="profileName">Студент</span>
    </div>
  </div>

  <div class="date-panel">
    <select id="weekSelect" class="week-select" onchange="render()"></select>
  </div>

  <div class="days-bar" id="daysBar"></div>
  <div class="schedule-list" id="scheduleList"></div>

  <!-- Модальное окно выбора профиля со свайпом -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-sheet" id="modalSheet">
      <div class="drag-handle-bar"></div>
      
      <div class="modal-header-row">
        <div class="modal-title">Мой профиль</div>
        <button type="button" class="modal-close-btn" onclick="closeProfileModal()">&times;</button>
      </div>
      <div class="modal-desc">Выберите направление подготовки и академическую группу:</div>
      
      <div class="form-group">
        <label>Направление подготовки</label>
        <select id="modalDirectionSelect" class="modal-select" onchange="onModalDirectionChange()"></select>
      </div>

      <div class="form-group">
        <label>Академическая группа</label>
        <select id="modalGroupSelect" class="modal-select"></select>
      </div>

      <button type="button" class="modal-btn" onclick="saveProfileSelection()">Сохранить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const userId = tgUser?.id || "guest_user";
    const userName = tgUser?.username ? `@${tgUser.username}` : (tgUser?.first_name || "Студент");

    document.getElementById("profileName").textContent = userName;
    const avatarContainer = document.getElementById("avatarContainer");
    if (tgUser?.photo_url) {
      avatarContainer.innerHTML = `<img src="${tgUser.photo_url}" class="user-avatar" alt="Avatar">`;
    } else {
      const initial = userName.replace('@', '')[0]?.toUpperCase() || "С";
      avatarContainer.innerHTML = `<div class="user-avatar">${initial}</div>`;
    }

    const DAYS = ["ПОНЕДЕЛЬНИК", "ВТОРНИК", "СРЕДА", "ЧЕТВЕРГ", "ПЯТНИЦА", "СУББОТА"];
    const SHORT_DAYS = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ"];
    
    let db = { groups: {}, weeks: {} };
    let directionsList = [];
    let allGroups = [];
    let currentGroup = "";
    let selectedDay = "ПОНЕДЕЛЬНИК";

    // Автоопределение текущего дня недели (вс -> пн)
    const todayIndex = new Date().getDay();
    if (todayIndex >= 1 && todayIndex <= 6) {
      selectedDay = DAYS[todayIndex - 1];
    } else {
      selectedDay = DAYS[0];
    }

    // Расчет курса студента по двум цифрам года поступления
    function formatGroupWithCourse(groupName) {
      const m = groupName.trim().match(/^([А-Яа-яA-Za-z0-9_]+?)[-_]?(\d{2})/);
      if (m) {
        const admissionYear = 2000 + parseInt(m[2], 10);
        const currentYear = new Date().getFullYear();
        const course = currentYear - admissionYear + 1;
        if (course >= 1 && course <= 6) {
          return `${groupName} (${course} курс)`;
        }
      }
      return groupName;
    }

    // Построение списка направлений по числовым индексам (защита от ошибок с кавычками)
    function buildDirectionsList(dbData) {
      const list = [];
      
      // 1. Все группы института
      list.push({
        id: 0,
        title: `🌟 Все направления (${allGroups.length} групп)`,
        groups: [...allGroups].sort()
      });

      // 2. Добавляем направления из schedule.json (если есть)
      if (dbData.directions && typeof dbData.directions === 'object') {
        for (const [title, grps] of Object.entries(dbData.directions)) {
          if (Array.isArray(grps) && grps.length > 0) {
            list.push({
              id: list.length,
              title: title,
              groups: [...grps].sort()
            });
          }
        }
      }

      // 3. Дополнительная группировка по шифрам групп
      const prefixMap = {};
      allGroups.forEach(g => {
        const m = g.trim().match(/^([А-Яа-яA-Za-z0-9]+)/);
        const pfx = m ? m[1].toUpperCase() : "ДРУГИЕ";
        if (!prefixMap[pfx]) prefixMap[pfx] = [];
        prefixMap[pfx].push(g);
      });

      // Если в schedule.json не было directions, используем префиксы
      if (list.length === 1) {
        for (const [pfx, grps] of Object.entries(prefixMap)) {
          list.push({
            id: list.length,
            title: `Направление ${pfx} (${grps.length} групп)`,
            groups: grps.sort()
          });
        }
      }

      return list;
    }

    async function init() {
      try {
        // Добавляем ?t=... для сброса кэша Telegram
        const res = await fetch('schedule.json?t=' + Date.now());
        db = await res.json();

        allGroups = db.groups ? Object.keys(db.groups) : Object.keys(db);
        if (!db.groups) db = { groups: db, weeks: {} };

        if (allGroups.length === 0) {
          document.getElementById("scheduleList").innerHTML = `<div class="empty-state">Нет данных о группах.</div>`;
          return;
        }

        directionsList = buildDirectionsList(db);

        const savedGroup = localStorage.getItem(`mgpu_group_${userId}`);
        if (savedGroup && db.groups[savedGroup]) {
          currentGroup = savedGroup;
          document.getElementById("headerGroupLabel").textContent = currentGroup;
          initDateSelection();
          renderDaysBar();
          render();
        } else {
          // Если группа еще не сохранена — берем первую и открываем онбординг
          currentGroup = allGroups[0];
          document.getElementById("headerGroupLabel").textContent = currentGroup;
          initDateSelection();
          renderDaysBar();
          render();
          openProfileModal();
        }
      } catch (err) {
        document.getElementById("scheduleList").innerHTML = 
          `<div class="empty-state">Ошибка загрузки расписания.<br>Проверьте schedule.json на GitHub.</div>`;
      }
    }

    function initDateSelection() {
      const weekSelect = document.getElementById("weekSelect");
      const list = db.groups[currentGroup] || [];
      const uniqueWeeks = [...new Set(list.map(x => x.week))].sort((a,b) => a - b);

      weekSelect.innerHTML = "";
      uniqueWeeks.forEach(w => {
        let label = `${w} неделя`;
        const wMeta = db.weeks ? (db.weeks[w] || db.weeks[String(w)]) : null;
        if (typeof wMeta === 'string' && wMeta.trim()) {
          label = wMeta;
        } else if (wMeta && typeof wMeta === 'object' && wMeta.label) {
          label = wMeta.label;
        } else {
          const sample = list.find(x => x.week === w && x.date_range);
          if (sample && sample.date_range) label = sample.date_range;
        }
        const opt = document.createElement("option");
        opt.value = w;
        opt.textContent = label;
        weekSelect.appendChild(opt);
      });

      // Автовыбор текущей недели
      const now = new Date();
      let matchedWeek = null;
      for (const w of uniqueWeeks) {
        const wMeta = db.weeks ? (db.weeks[w] || db.weeks[String(w)]) : null;
        let startDt = null, endDt = null;

        if (wMeta && typeof wMeta === 'object' && wMeta.start && wMeta.end) {
          startDt = new Date(wMeta.start);
          endDt = new Date(wMeta.end);
        } else {
          const str = (typeof wMeta === 'string') ? wMeta : (list.find(x => x.week === w)?.date_range || "");
          const match = str.match(/(\d{2})\.(\d{2})\.(\d{2,4})\s*–\s*(\d{2})\.(\d{2})\.(\d{2,4})/);
          if (match) {
            const y1 = match[3].length === 2 ? 2000 + parseInt(match[3]) : parseInt(match[3]);
            const y2 = match[6].length === 2 ? 2000 + parseInt(match[6]) : parseInt(match[6]);
            startDt = new Date(y1, parseInt(match[2]) - 1, parseInt(match[1]), 0, 0, 0);
            endDt = new Date(y2, parseInt(match[5]) - 1, parseInt(match[4]), 23, 59, 59);
          }
        }

        if (startDt && endDt && now >= startDt && now <= endDt) {
          matchedWeek = w;
          break;
        }
      }

      if (matchedWeek) weekSelect.value = matchedWeek;
      else if (uniqueWeeks.length > 0) weekSelect.value = uniqueWeeks[0];
    }

    function renderDaysBar() {
      const bar = document.getElementById("daysBar");
      bar.innerHTML = DAYS.map((d, i) => `
        <div class="day-chip ${d === selectedDay ? 'active' : ''}" onclick="selectDay('${d}')">
          ${SHORT_DAYS[i]}
        </div>
      `).join("");
    }

    function selectDay(day) {
      selectedDay = day;
      renderDaysBar();
      render();
    }

    function render() {
      const weekNum = parseInt(document.getElementById("weekSelect").value, 10);
      const container = document.getElementById("scheduleList");
      
      const lessons = (db.groups[currentGroup] || []).filter(
        item => item.week === weekNum && item.day === selectedDay
      );

      if (lessons.length === 0) {
        container.innerHTML = `<div class="empty-state">🎉 В этот день занятий нет</div>`;
        return;
      }

      lessons.sort((a, b) => a.pair - b.pair);

      container.innerHTML = lessons.map(item => `
        <div class="lesson-card ${item.is_parallel ? 'parallel' : ''}">
          <div class="lesson-header">
            <span class="lesson-time">${item.pair} пара • ${item.time}</span>
            <div class="badges">
              ${item.subgroup ? `<span class="badge parallel-badge">${item.subgroup}</span>` : ""}
              <span class="badge">${item.type}</span>
            </div>
          </div>
          <div class="lesson-name">${item.subject}</div>
          <div class="lesson-info">
            ${item.teacher ? `<div>${item.teacher}</div>` : ""}
            ${item.room ? `<div class="lesson-room">${item.room}</div>` : ""}
          </div>
        </div>
      `).join("");
    }

    /* Модальное окно профиля */
    function openProfileModal() {
      const dirSelect = document.getElementById("modalDirectionSelect");
      dirSelect.innerHTML = "";

      // Ищем индекс направления, в котором находится текущая группа
      let activeIndex = 0;
      directionsList.forEach((d, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = d.title;
        dirSelect.appendChild(opt);

        if (idx !== 0 && d.groups.includes(currentGroup)) {
          activeIndex = idx;
        }
      });

      dirSelect.value = activeIndex;
      onModalDirectionChange();

      const modal = document.getElementById("profileModal");
      const sheet = document.getElementById("modalSheet");
      modal.style.display = "flex";
      sheet.style.transform = "translateY(0)";
    }

    function closeProfileModal() {
      const modal = document.getElementById("profileModal");
      const sheet = document.getElementById("modalSheet");
      sheet.style.transform = "translateY(100%)";
      setTimeout(() => {
        modal.style.display = "none";
        sheet.style.transform = "";
      }, 220);
    }

    function onModalDirectionChange() {
      const dirSelect = document.getElementById("modalDirectionSelect");
      const grpSelect = document.getElementById("modalGroupSelect");
      const selectedIndex = parseInt(dirSelect.value, 10);
      
      const dirObj = directionsList[selectedIndex] || directionsList[0];
      const groups = (dirObj && dirObj.groups && dirObj.groups.length > 0) ? dirObj.groups : allGroups;

      grpSelect.innerHTML = "";
      groups.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = formatGroupWithCourse(g);
        if (g === currentGroup) opt.selected = true;
        grpSelect.appendChild(opt);
      });

      if (!grpSelect.value && groups.length > 0) {
        grpSelect.value = groups[0];
      }
    }

    function saveProfileSelection() {
      const grpSelect = document.getElementById("modalGroupSelect");
      let chosenGroup = grpSelect.value;

      if (!chosenGroup && grpSelect.options.length > 0) {
        chosenGroup = grpSelect.options[0].value;
      }

      if (!chosenGroup) {
        closeProfileModal();
        return;
      }

      currentGroup = chosenGroup;
      localStorage.setItem(`mgpu_group_${userId}`, currentGroup);
      document.getElementById("headerGroupLabel").textContent = currentGroup;
      closeProfileModal();

      initDateSelection();
      renderDaysBar();
      render();
    }

    /* Закрытие по клику на темный фон */
    document.getElementById("profileModal").addEventListener("click", (e) => {
      if (e.target.id === "profileModal") closeProfileModal();
    });

    /* Обработка жеста СВАЙПА ВНИЗ на мобильных */
    let touchStartY = 0;
    let touchCurrentY = 0;
    let isSwiping = false;
    const sheet = document.getElementById("modalSheet");

    sheet.addEventListener("touchstart", (e) => {
      if (e.target.tagName === "SELECT") return;
      touchStartY = e.touches[0].clientY;
      isSwiping = true;
      sheet.style.transition = "none";
    }, { passive: true });

    sheet.addEventListener("touchmove", (e) => {
      if (!isSwiping) return;
      touchCurrentY = e.touches[0].clientY;
      const deltaY = touchCurrentY - touchStartY;
      if (deltaY > 0) {
        sheet.style.transform = `translateY(${deltaY}px)`;
      }
    }, { passive: true });

    sheet.addEventListener("touchend", () => {
      if (!isSwiping) return;
      isSwiping = false;
      sheet.style.transition = "transform 0.22s ease-out";
      const deltaY = touchCurrentY - touchStartY;
      if (deltaY > 75) {
        closeProfileModal();
      } else {
        sheet.style.transform = "translateY(0)";
      }
      touchStartY = 0;
      touchCurrentY = 0;
    });

    init();
  </script>
</body>
</html>
