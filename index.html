<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>МГПУ • Расписание ИИЯ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --mgpu-red: #E30613;
      --mgpu-red-light: #FEECEB;
      --mgpu-dark: #1D1D1B;
      --bg: #F5F6F8;
      --card-bg: #FFFFFF;
      --text-sub: #7A7A7E;
      --border: #E8E8ED;
      --accent-orange: #FFF3E0;
      --accent-orange-text: #E65100;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--mgpu-dark); padding-bottom: 30px; }

    /* Шапка МГПУ */
    .header {
      background: #FFFFFF;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--mgpu-red);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { height: 36px; width: 36px; object-fit: contain; }
    .header-titles h1 { font-size: 15px; font-weight: 800; line-height: 1.1; }
    .header-titles .current-group { font-size: 12px; color: var(--mgpu-red); font-weight: 700; }

    /* Профиль пользователя Telegram */
    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 8px 4px 4px;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .user-profile-btn:active { opacity: 0.7; }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--mgpu-red);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      object-fit: cover;
    }
    .user-name { font-size: 12px; font-weight: 600; max-width: 95px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Выбор диапазона дат */
    .date-panel { padding: 12px 16px 6px; }
    .week-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--mgpu-dark);
      outline: none;
    }

    /* Лента дней недели */
    .days-bar {
      display: flex;
      gap: 6px;
      padding: 8px 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .days-bar::-webkit-scrollbar { display: none; }
    .day-chip {
      flex: 1;
      min-width: 48px;
      text-align: center;
      padding: 9px 2px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      transition: 0.15s ease;
    }
    .day-chip.active {
      background: var(--mgpu-red);
      border-color: var(--mgpu-red);
      color: #FFF;
    }

    /* Карточки пар */
    .schedule-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .lesson-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 4px solid var(--mgpu-red);
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .lesson-card.parallel {
      border-left-color: var(--accent-orange-text);
      background: #FDFAF5;
    }
    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .lesson-time { font-size: 12px; font-weight: 700; color: var(--mgpu-red); }
    .badges { display: flex; gap: 5px; }
    .badge {
      background: var(--mgpu-red-light);
      color: var(--mgpu-red);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.parallel-badge {
      background: var(--accent-orange);
      color: var(--accent-orange-text);
    }
    .lesson-name { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
    .lesson-info { font-size: 13px; color: var(--text-sub); }
    .lesson-room { font-weight: 600; color: var(--mgpu-dark); margin-top: 2px; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 14px; }

    /* Окно профиля / онбординга */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-sheet {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 30px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: var(--mgpu-dark); }
    .modal-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 18px; line-height: 1.4; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
    .modal-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      background: #FAFAFA;
      color: var(--mgpu-dark);
      outline: none;
    }
    .modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--mgpu-red);
      color: #FFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .modal-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="МГПУ" class="header-logo" onerror="this.style.display='none'">
      <div class="header-titles">
        <h1>МГПУ • ИИЯ</h1>
        <div class="current-group" id="headerGroupLabel">Группа не выбрана</div>
      </div>
    </div>
    <div class="user-profile-btn" onclick="openProfileModal()">
      <div id="avatarContainer"></div>
      <span class="user-name" id="profileName">Студент</span>
    </div>
  </div>

  <div class="date-panel">
    <select id="weekSelect" class="week-select" onchange="render()"></select>
  </div>

  <div class="days-bar" id="daysBar"></div>
  <div class="schedule-list" id="scheduleList"></div>

  <!-- Модальное окно выбора профиля -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-sheet">
      <div class="modal-title">Мой профиль</div>
      <div class="modal-desc">Выберите направление подготовки и академическую группу:</div>
      
      <div class="form-group">
        <label>Направление подготовки</label>
        <select id="modalDirectionSelect" class="modal-select" onchange="onModalDirectionChange()"></select>
      </div>

      <div class="form-group">
        <label>Академическая группа</label>
        <select id="modalGroupSelect" class="modal-select"></select>
      </div>

      <button class="modal-btn" onclick="saveProfileSelection()">Сохранить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const userId = tgUser?.id || "guest_user";
    const userName = tgUser?.username ? `@${tgUser.username}` : (tgUser?.first_name || "Студент");

    document.getElementById("profileName").textContent = userName;
    const avatarContainer = document.getElementById("avatarContainer");
    if (tgUser?.photo_url) {
      avatarContainer.innerHTML = `<img src="${tgUser.photo_url}" class="user-avatar" alt="Avatar">`;
    } else {
      const initial = userName.replace('@', '')[0]?.toUpperCase() || "С";
      avatarContainer.innerHTML = `<div class="user-avatar">${initial}</div>`;
    }

    const DAYS = ["ПОНЕДЕЛЬНИК", "ВТОРНИК", "СРЕДА", "ЧЕТВЕРГ", "ПЯТНИЦА", "СУББОТА"];
    const SHORT_DAYS = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ"];

    // Официальные расшифровки направлений МГПУ ИИЯ
    const PREFIX_NAMES = {
      'ПОЕ': 'Пед. образование: Европейские языки (ПОЕ)',
      'ПОК': 'Пед. образование: Китайский язык (ПОК)',
      'ПОЯ': 'Пед. образование: Японский язык (ПОЯ)',
      'ПОР': 'Пед. образование: Русский как иностранный (ПОР)',
      'ПО': 'Педагогическое образование (ПО)',
      'ЛИН': 'Лингвистика (ЛИН)',
      'ПЕР': 'Перевод и переводоведение (ПЕР)',
      'ТИМ': 'Теория и методика преподавания (ТИМ)',
      'ФИЛ': 'Зарубежная филология (ФИЛ)',
      'СМТ': 'Магистратура: Современные методики (СМТ)',
      'СМТВОСТ': 'Магистратура: Восточные языки (СМТ_ВОСТ)'
    };
    
    let db = { groups: {}, weeks: {} };
    let directionsMap = {};
    let currentGroup = "";
    let selectedDay = "ПОНЕДЕЛЬНИК";

    // Автоопределение сегодняшнего дня (вс -> пн)
    const todayIndex = new Date().getDay();
    if (todayIndex >= 1 && todayIndex <= 6) {
      selectedDay = DAYS[todayIndex - 1];
    } else {
      selectedDay = DAYS[0];
    }

    // Расчет курса по двум цифрам года поступления
    function formatGroupWithCourse(groupName) {
      const m = groupName.trim().match(/^([А-Яа-яA-Za-z_]+?)[-_]?(\d{2})/);
      if (m) {
        const admissionYear = 2000 + parseInt(m[2]);
        const currentYear = new Date().getFullYear();
        const course = currentYear - admissionYear + 1;
        if (course >= 1 && course <= 6) {
          return `${groupName} (${course} курс)`;
        }
        return `${groupName} (${admissionYear} г.п.)`;
      }
      return groupName;
    }

    // Построение карты направлений из шифров групп
    function buildDirectionsFromGroups(groupNames) {
      const map = {
        'ALL': { title: `🌟 Все направления (${groupNames.length} групп)`, groups: [...groupNames].sort() }
      };

      groupNames.forEach(grp => {
        const clean = grp.trim();
        const m = clean.match(/^([А-Яа-яA-Za-z_]+?)[-_]?(\d{2})/);
        let prefix = m ? m[1].replace(/_/g, '').toUpperCase() : 'ДРУГИЕ';
        
        let matchedKey = prefix;
        if (!PREFIX_NAMES[matchedKey]) {
          if (prefix.startsWith('СМТ')) matchedKey = 'СМТ';
          else if (prefix.startsWith('ПО')) matchedKey = 'ПО';
        }

        if (!map[matchedKey]) {
          const title = PREFIX_NAMES[matchedKey] || `${matchedKey} — Направление ${matchedKey}`;
          map[matchedKey] = { title, groups: [] };
        }
        map[matchedKey].groups.push(clean);
      });

      for (const k in map) {
        map[k].groups.sort();
      }
      return map;
    }

    // Безопасное заполнение выпадающего списка
    function populateDropdown(selectElem, items, activeValue) {
      selectElem.innerHTML = '';
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = item.label;
        if (item.value === activeValue) opt.selected = true;
        selectElem.appendChild(opt);
      });
    }

    async function init() {
      try {
        const res = await fetch('schedule.json');
        db = await res.json();

        // Поддержка обеих структур schedule.json
        if (!db.groups && typeof db === 'object') {
          db = { groups: db, weeks: {} };
        }

        const allGroups = Object.keys(db.groups || {});
        if (allGroups.length === 0) {
          document.getElementById("scheduleList").innerHTML = `<div class="empty-state">Нет данных о группах.</div>`;
          return;
        }

        // Строим направления по шифрам групп
        directionsMap = buildDirectionsFromGroups(allGroups);

        const savedGroup = localStorage.getItem(`mgpu_group_${userId}`);

        if (savedGroup && db.groups[savedGroup]) {
          currentGroup = savedGroup;
          document.getElementById("headerGroupLabel").textContent = currentGroup;
          initDateSelection();
          renderDaysBar();
          render();
        } else {
          openProfileModal(true);
        }
      } catch (err) {
        document.getElementById("scheduleList").innerHTML = 
          `<div class="empty-state">Ошибка загрузки расписания.<br>Проверьте файл schedule.json на GitHub.</div>`;
      }
    }

    function initDateSelection() {
      const weekSelect = document.getElementById("weekSelect");
      const list = db.groups[currentGroup] || [];
      const uniqueWeeks = [...new Set(list.map(x => x.week))].sort((a,b) => a - b);

      const weekItems = uniqueWeeks.map(w => {
        let label = `${w} неделя`;
        const wMeta = db.weeks ? (db.weeks[w] || db.weeks[String(w)]) : null;
        
        if (typeof wMeta === 'string' && wMeta.trim()) {
          label = wMeta;
        } else if (wMeta && typeof wMeta === 'object' && wMeta.label) {
          label = wMeta.label;
        } else {
          const sample = list.find(x => x.week === w && x.date_range);
          if (sample && sample.date_range) label = sample.date_range;
        }
        return { value: w, label: label };
      });

      // Автоопределение сегодняшней недели
      const now = new Date();
      let matchedWeek = null;

      for (const w of uniqueWeeks) {
        const wMeta = db.weeks ? (db.weeks[w] || db.weeks[String(w)]) : null;
        let startDt = null, endDt = null;

        if (wMeta && typeof wMeta === 'object' && wMeta.start && wMeta.end) {
          startDt = new Date(wMeta.start);
          endDt = new Date(wMeta.end);
        } else {
          const str = (typeof wMeta === 'string') ? wMeta : (list.find(x => x.week === w)?.date_range || "");
          const match = str.match(/(\d{2})\.(\d{2})\.(\d{2,4})\s*–\s*(\d{2})\.(\d{2})\.(\d{2,4})/);
          if (match) {
            const y1 = match[3].length === 2 ? 2000 + parseInt(match[3]) : parseInt(match[3]);
            const y2 = match[6].length === 2 ? 2000 + parseInt(match[6]) : parseInt(match[6]);
            startDt = new Date(y1, parseInt(match[2]) - 1, parseInt(match[1]), 0, 0, 0);
            endDt = new Date(y2, parseInt(match[5]) - 1, parseInt(match[4]), 23, 59, 59);
          }
        }

        if (startDt && endDt && now >= startDt && now <= endDt) {
          matchedWeek = w;
          break;
        }
      }

      const activeWeek = matchedWeek || (uniqueWeeks.length > 0 ? uniqueWeeks[0] : null);
      populateDropdown(weekSelect, weekItems, activeWeek);
    }

    function renderDaysBar() {
      const bar = document.getElementById("daysBar");
      bar.innerHTML = DAYS.map((d, i) => `
        <div class="day-chip ${d === selectedDay ? 'active' : ''}" onclick="selectDay('${d}')">
          ${SHORT_DAYS[i]}
        </div>
      `).join("");
    }

    function selectDay(day) {
      selectedDay = day;
      renderDaysBar();
      render();
    }

    function render() {
      const weekNum = parseInt(document.getElementById("weekSelect").value);
      const container = document.getElementById("scheduleList");
      
      const lessons = (db.groups[currentGroup] || []).filter(
        item => item.week === weekNum && item.day === selectedDay
      );

      if (lessons.length === 0) {
        container.innerHTML = `<div class="empty-state">🎉 В этот день занятий нет</div>`;
        return;
      }

      lessons.sort((a, b) => a.pair - b.pair);

      container.innerHTML = lessons.map(item => `
        <div class="lesson-card ${item.is_parallel ? 'parallel' : ''}">
          <div class="lesson-header">
            <span class="lesson-time">${item.pair} пара • ${item.time}</span>
            <div class="badges">
              ${item.subgroup ? `<span class="badge parallel-badge">${item.subgroup}</span>` : ""}
              <span class="badge">${item.type}</span>
            </div>
          </div>
          <div class="lesson-name">${item.subject}</div>
          <div class="lesson-info">
            ${item.teacher ? `<div>${item.teacher}</div>` : ""}
            ${item.room ? `<div class="lesson-room">${item.room}</div>` : ""}
          </div>
        </div>
      `).join("");
    }

    /* Модальное окно профиля */
    function openProfileModal(isFirstLaunch = false) {
      const dirSelect = document.getElementById("modalDirectionSelect");
      const dirKeys = Object.keys(directionsMap);
      if (dirKeys.length === 0) return;

      const dirItems = dirKeys.map(k => ({ value: k, label: directionsMap[k].title }));

      // Ищем, в каком направлении находится текущая группа
      let activeDir = dirKeys[0];
      if (currentGroup) {
        for (const k of dirKeys) {
          if (k !== 'ALL' && directionsMap[k].groups.includes(currentGroup)) {
            activeDir = k;
            break;
          }
        }
      }

      populateDropdown(dirSelect, dirItems, activeDir);
      onModalDirectionChange();

      if (currentGroup) {
        document.getElementById("modalGroupSelect").value = currentGroup;
      }

      document.getElementById("profileModal").style.display = "flex";
    }

    function onModalDirectionChange() {
      const dirKey = document.getElementById("modalDirectionSelect").value;
      const grpSelect = document.getElementById("modalGroupSelect");
      const groups = directionsMap[dirKey] ? directionsMap[dirKey].groups : [];

      const groupItems = groups.map(g => ({
        value: g,
        label: formatGroupWithCourse(g)
      }));

      // Если текущая группа есть в выбранном направлении — сохраняем выбор
      const selected = groups.includes(currentGroup) ? currentGroup : (groups[0] || "");
      populateDropdown(grpSelect, groupItems, selected);
    }

    function saveProfileSelection() {
      const chosenGroup = document.getElementById("modalGroupSelect").value;
      if (!chosenGroup) {
        alert("Пожалуйста, выберите группу.");
        return;
      }

      currentGroup = chosenGroup;
      localStorage.setItem(`mgpu_group_${userId}`, currentGroup);
      document.getElementById("headerGroupLabel").textContent = currentGroup;
      document.getElementById("profileModal").style.display = "none";

      initDateSelection();
      renderDaysBar();
      render();
    }

    init();
  </script>
</body>
</html>
