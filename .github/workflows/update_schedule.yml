name: Auto Update Schedule from VK

on:
  schedule:
    # Запуск дважды в день: в 07:00 и 17:00 по МСК (04:00 и 14:00 UTC)
    - cron: '0 4,14 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: |
          pip install requests openpyxl

      - name: Проверка и парсинг
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: |
          python auto_checker.py

      - name: Сохранение обновлений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json .last_scraped_title
          if git diff --staged --quiet; then
            echo "Новых расписаний нет, коммит не требуется."
          else
            git commit -m "Auto-update: актуализация расписания из ВК [skip ci]"
            git push
          fi
